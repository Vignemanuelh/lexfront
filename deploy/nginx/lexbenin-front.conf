# ==============================================================================
# LEXBENIN — Nginx (hôte VPS) — Front : lexbenin.emmanuelhoudji.com
# TLS : sudo certbot --nginx -d lexbenin.emmanuelhoudji.com
# ==============================================================================

upstream lexfront_upstream {
    server 127.0.0.1:3000;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=lex_front:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name lexbenin.emmanuelhoudji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lexbenin.emmanuelhoudji.com;

    ssl_certificate     /etc/letsencrypt/live/lexbenin.emmanuelhoudji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexbenin.emmanuelhoudji.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Micro et caméra autorisés (notes vocales / captures) pour ce domaine uniquement
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Assets statiques Next.js immuables (hash dans le nom)
    location /_next/static/ {
        proxy_pass http://lexfront_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=lex_front burst=40 nodelay;
        proxy_pass http://lexfront_upstream;
        proxy_read_timeout 60s;
    }
}
